name: Container Security Scan

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "requirements/runtime.txt", ".github/workflows/container-scan.yml"]
  pull_request:
    branches: [main]
    paths: ["Dockerfile", "requirements/runtime.txt", ".github/workflows/container-scan.yml"]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build image
        run: docker build -t loanrisk-scan:ci .
      - name: Block high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: loanrisk-scan:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: loanrisk-scan:ci
          format: spdx-json
          output: sbom.spdx.json
      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx
          path: sbom.spdx.json
