name: Container Security Scan

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "requirements/runtime.txt", ".github/workflows/container-scan.yml"]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loanrisk-scan:ci .
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: loanrisk-scan:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: loanrisk-scan:ci
          format: spdx-json
          output: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
