name: Docker-Publish (legacy compatibility)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delegated:
    runs-on: ubuntu-latest
    steps:
      - name: Explain canonical release path
        run: |
          echo "Automated versioned container publishing is owned by .github/workflows/release.yml."
          echo "Use the Release workflow so image scanning, SBOM generation, digest signing, checksums, and GitHub Release evidence remain one auditable transaction."
