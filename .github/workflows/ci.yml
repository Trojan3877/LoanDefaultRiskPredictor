name: Build-Test-Deploy-Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m compileall -q api src tests
          pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: coverage.xml

  deployment-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag loan-risk-api:ci .
      - name: Inspect non-root runtime
        run: test "$(docker image inspect loan-risk-api:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f infra/k8s/deployment.yaml
          kubectl apply --dry-run=client -f infra/k8s/service.yaml
