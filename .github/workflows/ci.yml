name: L6-Engineering-Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements/dev.txt
      - name: Static quality gates
        run: |
          ruff check api src tests --select E9,F63,F7,F82
          mypy api --ignore-missing-imports
          bandit -q -r api src -x tests
      - name: Compile and test
        run: |
          python -m compileall -q api src tests
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=45
      - name: Audit runtime dependencies
        run: pip-audit --requirement requirements/runtime.txt
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: coverage.xml

  deployment-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal container
        run: docker build --tag loan-risk-api:ci .
      - name: Inspect runtime security contract
        run: |
          test "$(docker image inspect loan-risk-api:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect loan-risk-api:ci --format '{{json .Config.Healthcheck}}')" != "null"
      - name: Smoke test container
        run: |
          docker run --detach --rm --name loan-risk-ci --publish 8000:8000 loan-risk-api:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 1
          done
          docker logs loan-risk-ci
          exit 1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Validate Kubernetes manifests offline
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.7.0             -strict -summary -kubernetes-version 1.31.0 /work/infra/k8s
