name: L6 Evidence & Delivery Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: python -m pip install --requirement requirements/dev.txt
      - name: Static and security gates
        run: |
          ruff check api src evaluation tests scripts benchmarks
          mypy api --ignore-missing-imports
          bandit -q -r api src evaluation -x tests -ll
      - name: Test critical paths
        run: |
          python -m compileall -q api src evaluation tests scripts benchmarks
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
      - name: Audit runtime dependencies
        run: pip-audit --requirement requirements/runtime.txt

  deployment-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --requirement requirements/dev.txt
      - name: Generate CI benchmark evidence
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m benchmarks.inference --iterations 1000 --warmup 100 --output outputs/ci-inference-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: outputs/ci-inference-benchmark.json
      - name: Create a CI-only verified bundle
        run: python -m scripts.build_smoke_bundle --output models/ci
      - run: docker build --tag loan-risk-api:ci .
      - name: Inspect and smoke-test model-backed container
        run: |
          test "$(docker image inspect loan-risk-api:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --detach --rm --name loan-risk-ci -p 8000:8000 \
            --read-only --tmpfs /tmp --env ENVIRONMENT=production \
            --env MODEL_BUNDLE_PATH=/models/current --env LOAN_RISK_API_KEY=ci-secret \
            --volume "$PWD/models/ci:/models/current:ro" loan-risk-api:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/readyz | grep test-smoke-v1
      - run: docker compose config --quiet
        env:
          LOAN_RISK_API_KEY: ci-secret
      - run: docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.31.0 /work/infra/k8s
