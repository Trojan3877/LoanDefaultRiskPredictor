[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-default-risk-predictor"
version = "0.1.0"
description = "Production-grade Loan Default Risk Predictor using LightGBM, FastAPI, and MLflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Corey Leath", email = "coreyleath10@gmail.com" }
]
keywords = ["fintech", "credit-risk", "machine-learning", "fastapi", "lightgbm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "fastapi>=0.100,<1",
  "uvicorn>=0.23,<1",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "numpy>=1.24,<3",
  "torch>=2.0,<3",
  "xgboost>=2.0,<3",
  "lightgbm>=4.0,<5",
  "optuna>=3.3,<5",
  "mlflow>=2.6,<3",
  "streamlit>=1.27,<2",
  "joblib>=1.3,<2",
  "boto3>=1.28,<2",
  "requests>=2.31,<3",
  "category_encoders>=2.6,<3",
  "prometheus_client>=0.17,<1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "features*", "llm*", "models*", "mlops*", "training*", "ui*", "evaluation*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "api", "features", "llm", "models", "mlops", "training", "evaluation"]
omit = ["tests/*", "scripts/*"]
