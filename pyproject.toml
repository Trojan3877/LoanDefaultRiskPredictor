[build-system]
requires = ["setuptools>=80,<81", "wheel>=0.46,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-default-risk-predictor"
version = "0.2.0"
description = "Research-oriented loan default risk pipeline and hardened API facade"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Corey Leath" }]
keywords = ["fintech", "credit-risk", "machine-learning", "fastapi", "lightgbm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.139,<0.140",
  "uvicorn>=0.51,<0.52",
  "prometheus-client>=0.25,<0.26",
]

[project.optional-dependencies]
train = [
  "pandas>=2.3,<2.4",
  "scikit-learn>=1.9,<1.10",
  "numpy>=2.4,<2.5",
  "torch>=2.13,<2.14",
  "xgboost>=3.2,<3.3",
  "lightgbm>=4.6,<4.7",
  "optuna>=4.9,<4.10",
  "mlflow>=3.14,<3.15",
  "streamlit>=1.59,<1.60",
  "joblib>=1.5,<1.6",
  "boto3>=1.43,<1.44",
  "requests>=2.34,<2.35",
  "category-encoders>=2.9,<2.10",
]
dev = [
  "loan-default-risk-predictor[train]",
  "pytest>=9.1,<9.2",
  "pytest-cov>=7.1,<7.2",
  "httpx2>=2.0,<3",
  "ruff>=0.12,<1",
  "mypy>=1.18,<2",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "features*", "llm*", "models*", "mlops*", "training*", "ui*", "evaluation*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src", "api", "features", "llm", "models", "mlops", "training", "evaluation"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
fail_under = 18

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests"]
