site_name: Loan Default Risk Predictor
site_description: Research-oriented credit-risk pipeline and L6 deployment baseline
site_url: https://coreyleath-code.github.io/LoanDefaultRiskPredictor/
repo_name: CoreyLeath-code/LoanDefaultRiskPredictor
repo_url: https://github.com/CoreyLeath-code/LoanDefaultRiskPredictor
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.follow

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - L6 Engineering Quality: L6_ENGINEERING_QUALITY.md

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - mike:
      default_version: latest
      default_branch: gh-pages
