site_name: Loan Default Risk Predictor
site_description: Model-backed credit-risk research pipeline and L5 production-candidate baseline
site_url: https://coreyleath-code.github.io/LoanDefaultRiskPredictor/
repo_name: CoreyLeath-code/LoanDefaultRiskPredictor
repo_url: https://github.com/CoreyLeath-code/LoanDefaultRiskPredictor
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.follow

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - L5 Engineering Quality: L5_ENGINEERING_QUALITY.md
  - Model Card: MODEL_CARD.md
  - Benchmarks: BENCHMARKS.md
  - Operations: OPERATIONS.md
  - Governance: GOVERNANCE.md

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

extra:
  version:
    provider: mike
