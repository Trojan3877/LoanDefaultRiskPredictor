apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-risk-api
  labels:
    app.kubernetes.io/name: loan-risk
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loan-risk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loan-risk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with an immutable release digest in each environment.
          image: ghcr.io/coreyleath-code/loandefaultriskpredictor:v0.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ENVIRONMENT
              value: production
            - name: MODEL_BUNDLE_PATH
              value: /models/current
            - name: LOAN_RISK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loan-risk-api
                  key: api-key
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model
              mountPath: /models/current
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: model
          persistentVolumeClaim:
            claimName: loan-risk-model
