# ─────────────────────────────────────────────────────────────
# LoanDefaultRiskPredictor • Helm values
# Override any key with:  helm upgrade -f my_values.yaml …
# ─────────────────────────────────────────────────────────────

replicaCount: 2

image:
  repository: ghcr.io/coreyleath-code/loandefaultriskpredictor
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

model:
  path: /models/current
  pvcName: loan-risk-model

apiKeySecret:
  name: loan-risk-api
  key: api-key

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
