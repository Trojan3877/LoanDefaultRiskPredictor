apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loandefault.fullname" . }}
  labels:
    {{- include "loandefault.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "loandefault.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loandefault.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loandefault
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ENVIRONMENT
              value: production
            - name: MODEL_BUNDLE_PATH
              value: {{ .Values.model.path | quote }}
            - name: LOAN_RISK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret.name }}
                  key: {{ .Values.apiKeySecret.key }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: model
              mountPath: {{ .Values.model.path }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: {{ .Values.model.pvcName }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
